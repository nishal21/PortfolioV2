# Use BEFORE certbot has certificates (first deploy only).
# After: certbot --nginx -d nishal.dev -d www.nishal.dev
# Then replace with nginx-nishal.dev.conf (or let certbot patch this file).

server {
    listen 80;
    listen [::]:80;
    server_name nishal.dev www.nishal.dev;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
