# nishal.dev — portfolio Next.js on :3002 (PM2: portfolio-v2)
# Does not touch NMHelper (3001 API, 3005 nmhelper.in).
#
#   sudo cp /opt/portfolio-v2/deploy/nginx-nishal.dev.conf /etc/nginx/sites-available/nishal.dev
#   sudo ln -sf /etc/nginx/sites-available/nishal.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nishal.dev -d www.nishal.dev

server {
    listen 80;
    listen [::]:80;
    server_name nishal.dev www.nishal.dev;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://nishal.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nishal.dev;

    ssl_certificate /etc/letsencrypt/live/nishal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nishal.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://nishal.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nishal.dev;

    ssl_certificate /etc/letsencrypt/live/nishal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nishal.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    location = /.well-known/security.txt {
        proxy_pass http://127.0.0.1:3002/.well-known/security.txt;
        proxy_set_header Host $host;
        default_type text/plain;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(hero\.mp4|hero-poster\.jpg)$ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
